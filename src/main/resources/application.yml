spring:
  application:
    name: enterprise-payment-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_platform}
    username: ${SPRING_DATASOURCE_USERNAME:payment_app}
    password: ${SPRING_DATASOURCE_PASSWORD:local_dev_password_change_me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 15000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include:
            - readinessState
            - db
        liveness:
          include: livenessState

logging:
  level:
    root: INFO
    com.enterprise.payment: DEBUG

app:
  kafka:
    transfer-topic: payment.transfer-events
    transfer-dlt-topic: payment.transfer-events.DLT
    dlt-replay-timeout-seconds: ${KAFKA_DLT_REPLAY_TIMEOUT_SECONDS:10}
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:true}
    cron: ${RECONCILIATION_CRON:0 15 2 * * *}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT_SECONDS:10}
    lease-duration-seconds: ${OUTBOX_LEASE_DURATION_SECONDS:300}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
  security:
    jwt:
      issuer: enterprise-payment-platform
      audience: payment-api
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/jwt-public.pem}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:classpath:keys/jwt-private.pem}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///payment_platform
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379


  kafka:
    listener:
      auto-startup: false
app:
  outbox:
    enabled: false
  security:
    jwt:
      public-key-location: classpath:keys/jwt-public.pem
      private-key-location: classpath:keys/jwt-private.pem
  reconciliation:
    enabled: false
